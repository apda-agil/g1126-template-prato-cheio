
services:
  postgres:
    image: postgres:16-alpine
    container_name: prato-cheio-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: prato_cheio
      POSTGRES_PASSWORD: prato_cheio
      POSTGRES_DB: prato_cheio

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prato_cheio -d prato_cheio"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
