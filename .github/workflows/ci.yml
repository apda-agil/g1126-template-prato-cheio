
name: CI

on:
  push:
    branches: [main, migracao-postgresql]
  pull_request:

jobs:
  build-e-testes:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prato_cheio
          POSTGRES_PASSWORD: prato_cheio
          POSTGRES_DB: prato_cheio
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U prato_cheio -d prato_cheio"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://prato_cheio:prato_cheio@localhost:5432/prato_cheio
      DATABASE_TEST_URL: postgresql://prato_cheio:prato_cheio@localhost:5432/prato_cheio_test

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm ci

      - name: Criar banco de testes
        run: |
          PGPASSWORD=prato_cheio psql -h localhost -U prato_cheio -d prato_cheio -c 'CREATE DATABASE prato_cheio_test;'

      - name: Executar testes
        run: npm test

      - name: Verificar inicializacao da aplicacao
        run: |
          npm start &
          for i in {1..15}; do
            curl --fail http://localhost:3000/api/saude && exit 0
            sleep 2
          done
          exit 1
